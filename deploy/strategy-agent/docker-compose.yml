name: strategy-agent

# Finextium 24/7 automated-strategy agent — appears in the Hostinger Docker Manager
# as project "strategy-agent". Evaluates every user's ACTIVE automated_strategies on
# an interval and executes them (paper/live/alert) even while the website is closed.
services:
  agent:
    build: .
    container_name: finextium-strategy-agent
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
