# Builds the Finextium native app shell (mobile-app/, Capacitor 8).
#  • Android: assembles an installable APK and publishes it on the "app-latest" release, so it can be
#    downloaded straight to the phone:
#    https://github.com/nervousman1-sys/Dashboard-Portfolio-Manager/releases/download/app-latest/Finextium.apk
#  • iOS: compiles the Xcode project for the simulator (verifies the native code). Installing on a real
#    iPhone / App Store needs an Apple Developer account + signing — see mobile-app/README.md.
# The app loads the live platform (https://www.finextium.com), so website changes reach the app
# without a rebuild; this workflow only matters when mobile-app/ itself changes.
name: Mobile app

on:
  push:
    branches: [design-update-google, main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # Optional stable signing key: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD to sign every build with the same key (in-place updates).
      # Without them the APK is signed with the runner's debug key.
      - name: Prepare signing key (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Always a RELEASE build (not debuggable: no adb run-as / WebView devtools access to the
        # stored session). Without the stable-key secrets, sign with a one-off key generated on the
        # runner and discarded afterwards (then a newer APK needs an uninstall first).
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/finextium-release.keystore
            echo "FINX_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "FINX_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "FINX_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 24)
            echo "::add-mask::$PW"
            keytool -genkeypair -noprompt -keystore android/app/finextium-release.keystore -storetype PKCS12 \
              -alias finextium -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Finextium, O=Finextium, C=IL"
            echo "FINX_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "FINX_KEY_ALIAS=finextium" >> "$GITHUB_ENV"
            echo "FINX_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Finextium.apk
          rm -f app/finextium-release.keystore

      - name: Verify the APK is a non-debuggable release
        working-directory: mobile-app
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT" dump badging Finextium.apk | grep -q "application-debuggable"; then
            echo "::error::APK is debuggable"; exit 1
          fi
          "$(dirname "$AAPT")/apksigner" verify --print-certs Finextium.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: Finextium-android
          path: mobile-app/Finextium.apk

      - name: Publish to the "app-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Finextium for Android — build ${GITHUB_SHA::7} ($(date -u +'%Y-%m-%d %H:%M UTC')). Download Finextium.apk on the phone and install it."
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest Finextium.apk --title "Finextium App (Android)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      - name: Build for the iOS simulator (compile check, unsigned)
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
